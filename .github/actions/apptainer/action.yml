# **apptainer 는 우분투 기본 저장소에 없다.** 공식 PPA 에서 온다.
#
# 기본 저장소에 있다고 적으면 `Unable to locate package apptainer` 로 죽는데
# (apt 는 exit 100 을 낸다), 그 메시지는 「없다」 고만 말하지 **어디서 받아야
# 하는지는 말하지 않는다.** 실측으로 겪었다 — 이 저장소의 첫 CI 가 그것으로
# 실패했고, 그때까지 이미지 잡은 한 번도 성공한 적이 없었다.
#
# **두 워크플로(ci·release)가 같은 설치를 한다.** 두 벌로 적으면 한쪽만
# 고쳐지고, 그때부터 「CI 는 도는데 릴리스는 안 되는」 상태가 된다 — 그리고
# 그것은 배포하려는 날에 드러난다.
#
# 개발 기계도 같은 PPA 에서 받는다. 지형이 다르면 한쪽은 아무도 안 돌려 본
# 쪽이 되고, 그 사실은 그쪽으로 배포하려는 날에야 보인다.
#
# **PPA 가 안 되면 공식 GitHub 릴리스의 .deb 로 우회한다.** Launchpad 가 몇 시간씩 503 을
# 오가면(2026-11-23 — 열렸다 닫혔다를 1시간 넘게) 릴리스가 설치 단계에서 세 번 멈췄다. 우회는
# **판과 지문을 박아 둔** 파일 하나다 — 같은 판(1.5.5)의 PPA 것(`1.5.5-1~noble`)과 기대는
# 패키지가 같다(우분투 기본 저장소의 것들). 받은 .deb 는 `APPTAINER_DEB_DIR` 로 알려 번들
# 빌드가 폐쇄망용으로 담게 한다 — apt 목록에 apptainer 가 없으니 `apt-get download` 가 못 받는다.
# PPA 로 깔았어도 번들 빌드의 `apt-get download` 가 같은 503 에 걸릴 수 있다(v0.2.14 의 첫 릴리스가
# 「번들이 온전한가」 에서 멈췄다) — 그래서 우회 파일의 주소 · 지문(`APPTAINER_FALLBACK_URL` ·
# `_SHA256`)은 늘 알린다. 판을 올릴 때는 아래 두 값을 함께 바꾼다(지문은 릴리스 화면 · API 의
# `digest`).

name: apptainer 설치
description: Apptainer 를 공식 PPA 에서 설치하고(안 되면 공식 GitHub 릴리스의 .deb 로), 실제로 실행되는지 확인한다.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        FALLBACK_VERSION: '1.5.5'
        FALLBACK_SHA256: '25095d3711504b3e8657dbb2e172ef8db9db43c4503d940c9c36b105db8dce77'
      run: |
        set -euo pipefail
        # 잠깐씩 끊기는 저장소를 몇 번 더 두드린다 — 한 번의 503 으로 우회까지 가지 않게.
        APT=(sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30)
        "${APT[@]}" update
        # add-apt-repository 를 주는 패키지. 러너에는 이미 있지만, 없는 이미지로
        # 바뀌는 날 이 줄이 없으면 다음 줄이 「명령이 없다」 로 죽는다.
        "${APT[@]}" install -y --no-install-recommends software-properties-common

        # 함수 안의 실패는 `|| return 1` 로 돌려준다 — `if` 안에서는 set -e 가 서지 않는다.
        via_ppa() {
          sudo add-apt-repository -y -n ppa:apptainer/ppa || return 1
          "${APT[@]}" update || return 1
          # 여기서는 recommends 를 막지 않는다 — 빠진 조각은 **빌드할 때**
          # 드러나고, 그 오류는 설치를 가리키지 않는다.
          "${APT[@]}" install -y apptainer || return 1
        }

        via_release() {
          # 반쯤 더한 PPA 를 걷는다 — 남겨 두면 뒤의 apt 가 같은 503 으로 멈춘다.
          sudo add-apt-repository -y -r -n ppa:apptainer/ppa || true
          sudo rm -f /etc/apt/sources.list.d/apptainer-ubuntu-ppa*
          "${APT[@]}" update
          local dir="$RUNNER_TEMP/apptainer-debs"
          local deb="apptainer_${FALLBACK_VERSION}_amd64.deb"
          mkdir -p "$dir"
          curl -fsSL --retry 5 --retry-all-errors -o "$dir/$deb" \
            "https://github.com/apptainer/apptainer/releases/download/v${FALLBACK_VERSION}/${deb}"
          echo "${FALLBACK_SHA256}  $dir/$deb" | sha256sum -c -
          # 경로로 주면 apt 가 기대는 패키지(uidmap · libfuse3-3 …)를 기본 저장소에서 함께 푼다.
          "${APT[@]}" install -y "$dir/$deb"
          echo "APPTAINER_DEB_DIR=$dir" >> "$GITHUB_ENV"
        }

        if ! via_ppa; then
          echo "::warning title=apptainer::PPA(ppa.launchpadcontent.net)에서 설치하지 못해 공식 GitHub 릴리스의 .deb(v${FALLBACK_VERSION}, 지문 확인)로 설치합니다."
          via_release
        fi
        # 번들 빌드가 PPA 에서 .deb 를 못 받을 때 쓸 자리 — 어느 길로 깔았든 알린다.
        {
          echo "APPTAINER_FALLBACK_URL=https://github.com/apptainer/apptainer/releases/download/v${FALLBACK_VERSION}/apptainer_${FALLBACK_VERSION}_amd64.deb"
          echo "APPTAINER_FALLBACK_SHA256=${FALLBACK_SHA256}"
        } >> "$GITHUB_ENV"
        # **깔린 것과 도는 것은 다른 일이다.** 확인하고 넘어간다.
        apptainer --version
